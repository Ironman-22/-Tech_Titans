<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Helper — Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #0B6E6E; --teal-light: #E8F4F4;
      --amber: #C98A1B; --amber-light: #FEF6E0;
      --red: #EF4444; --red-light: #FEE2E2;
      --text-1: #111827; --text-2: #6B7280; --text-3: #9CA3AF;
      --surface: #FFFFFF; --bg: #F9FAFB;
      --divider: #E5E7EB; --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font); font-size: 14px; line-height: 1.5;
      color: var(--text-1); background: var(--bg);
      -webkit-font-smoothing: antialiased;
      padding: 32px; max-width: 560px; margin: 0 auto;
    }
    h1 {
      font-size: 20px; font-weight: 600; margin-bottom: 4px;
      display: flex; align-items: center; gap: 8px;
    }
    .subtitle { font-size: 13px; color: var(--text-3); margin-bottom: 24px; }
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-3); margin-bottom: 12px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--text-2); margin-bottom: 4px;
    }
    .field input, .field textarea {
      width: 100%; font-family: var(--font); font-size: 13px;
      border: 1px solid var(--divider); border-radius: var(--radius);
      padding: 8px 12px; color: var(--text-1); background: var(--surface);
      transition: border-color .15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--teal); outline: none;
    }
    .field select, .model-select {
      width: 100%; font-family: var(--font); font-size: 13px;
      border: 1px solid var(--divider); border-radius: var(--radius);
      padding: 8px 12px; color: var(--text-1); background: var(--surface);
      cursor: pointer; appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236B7280' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    .field textarea { resize: vertical; min-height: 60px; }

    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }

    /* Custom key-value pairs */
    .kv-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .kv-row input { flex: 1; font-family: var(--font); font-size: 13px;
      border: 1px solid var(--divider); border-radius: var(--radius);
      padding: 6px 10px; color: var(--text-1); background: var(--surface); }
    .kv-row input:focus { border-color: var(--teal); outline: none; }
    .kv-remove {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border: none; background: none; color: var(--text-3); cursor: pointer; font-size: 18px;
      border-radius: var(--radius);
    }
    .kv-remove:hover { background: var(--red-light); color: var(--red); }
    .add-kv {
      font-family: var(--font); font-size: 12px; font-weight: 500;
      color: var(--teal); background: none; border: 1px dashed var(--divider);
      border-radius: var(--radius); padding: 6px 14px; cursor: pointer;
    }
    .add-kv:hover { background: var(--teal-light); border-color: var(--teal); }

    /* Buttons */
    .btn {
      font-family: var(--font); font-size: 13px; font-weight: 500;
      padding: 8px 20px; border-radius: var(--radius); cursor: pointer;
      border: none; transition: background .15s;
    }
    .btn-primary { background: var(--teal); color: #fff; }
    .btn-primary:hover { background: #095c5c; }
    .btn-secondary { background: var(--surface); color: var(--teal); border: 1px solid var(--teal); }
    .btn-secondary:hover { background: var(--teal-light); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .conn-status {
      font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
    }
    .conn-status.ok { color: #10B981; }
    .conn-status.err { color: var(--red); }
    .conn-status.testing { color: var(--text-2); }

    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .spacer { flex: 1; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--teal); color: #fff; padding: 8px 20px;
      border-radius: 100px; font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .toast.visible { opacity: 1; }

    hr { border: none; border-top: 1px solid var(--divider); margin: 20px 0; }

    .api-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }
  </style>
</head>
<body>

  <h1>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
      <rect width="24" height="24" rx="6" fill="#0B6E6E"/>
      <path d="M7 8.5h10M7 12h7M7 15.5h10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    Web Helper Settings
  </h1>
  <p class="subtitle">Your profile is stored locally on this device only.</p>

  <!-- ── Profile ─────────────────────────── -->
  <div class="section">
    <div class="section-title">Profile</div>
    <div class="row">
      <div class="field"><label>Full Name</label><input id="name" type="text" placeholder="Rahul Kumar"></div>
      <div class="field"><label>Gender</label><input id="gender" type="text" placeholder="Male / Female / Other"></div>
    </div>
    <div class="row">
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Phone</label><input id="phone" type="tel" placeholder="+91 98765 43210"></div>
    </div>
    <div class="field"><label>Address</label><textarea id="address" placeholder="123 MG Road, Bangalore"></textarea></div>
    <div class="row">
      <div class="field"><label>City</label><input id="city" type="text" placeholder="Bangalore"></div>
      <div class="field"><label>State</label><input id="state" type="text" placeholder="Karnataka"></div>
      <div class="field"><label>Pincode</label><input id="pincode" type="text" placeholder="560001"></div>
    </div>
    <div class="field"><label>Date of Birth</label><input id="dob" type="text" placeholder="1998-05-15"></div>
    <div class="row">
      <div class="field"><label>Father's Name</label><input id="fatherName" type="text"></div>
      <div class="field"><label>Mother's Name</label><input id="motherName" type="text"></div>
    </div>
  </div>

  <!-- ── Education & income ──────────────── -->
  <div class="section">
    <div class="section-title">Education &amp; Income</div>
    <div class="row">
      <div class="field"><label>Education</label><input id="education" type="text" placeholder="B.E. Computer Science"></div>
      <div class="field"><label>Marks / Percentage</label><input id="marks" type="text" placeholder="85%"></div>
    </div>
    <div class="row">
      <div class="field"><label>Annual Income</label><input id="income" type="text" placeholder="₹5,00,000"></div>
      <div class="field"><label>Category</label><input id="category" type="text" placeholder="General / OBC / SC / ST"></div>
    </div>
  </div>

  <!-- ── Custom key-value pairs ──────────── -->
  <div class="section">
    <div class="section-title">Custom Fields</div>
    <div id="custom-fields"></div>
    <button class="add-kv" id="add-kv-btn">+ Add custom field</button>
  </div>

  <hr>

  <!-- ── LLM Settings ──────────────────────── -->
  <div class="section">
    <div class="section-title">LLM Settings</div>
    <div class="field">
      <label>Gemini API Key</label>
      <input id="apiKey" type="password" placeholder="Paste your Gemini API key here" autocomplete="off">
      <p class="api-hint">Leave blank to use mock mode (works offline for testing). Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a>.</p>
    </div>
    <div class="field">
      <label>Model</label>
      <select id="modelSelect" class="model-select">
        <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite — newest, ultra fast</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash — recommended, balanced</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash — fast, intelligent</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite — lightweight</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite — legacy fast</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro — most capable</option>
      </select>
      <p class="api-hint">Choose which Gemini model to use for field matching.</p>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
      <button type="button" class="btn btn-secondary" id="test-conn-btn">Test Connection</button>
      <span id="conn-status" class="conn-status"></span>
    </div>
  </div>

  <!-- ── Actions ─────────────────────────── -->
  <div class="actions">
    <button class="btn btn-primary" id="save-btn">Save</button>
    <div class="spacer"></div>
    <button class="btn btn-danger" id="delete-btn">Delete All My Data</button>
  </div>

  <div class="toast" id="toast">Saved</div>

  <script src="options.js"></script>
</body>
</html>
