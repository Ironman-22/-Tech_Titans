<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormMitra</title>
  <link rel="stylesheet" href="sidepanel.css">
  <link rel="stylesheet" href="details.css">
</head>
<body>
  <header class="header">
    <div class="header-row">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#0B6E6E"/>
          <path d="M7 8.5h10M7 12h7M7 15.5h10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">FormMitra</span>
      </div>

      <div class="header-controls">
        <select id="provider-select" class="select-compact" aria-label="AI provider">
          <option value="auto">Auto</option>
          <option value="gemini">Gemini</option>
          <option value="groq">Groq</option>
        </select>

        <select id="lang-select" class="select-compact" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="kn">ಕನ್ನಡ</option>
        </select>

        <button id="btn-refresh" type="button" class="icon-btn" aria-label="Refresh page snapshot" title="Refresh page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>

        <button id="btn-settings" type="button" class="icon-btn" aria-label="Open Settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="page-bar">
      <div class="page-info-row">
        <span id="page-title" class="page-title">Reading page...</span>
        <span id="page-chars" class="page-chars">Read 0 chars</span>
      </div>
      <div class="translate-bar">
        <button id="btn-translate-page" type="button" class="btn-bar">Translate page</button>
        <button id="btn-show-original" type="button" class="btn-bar hidden">Show original</button>
        <button id="btn-translate-cancel" type="button" class="btn-bar btn-bar-stop hidden">Cancel</button>
        <span id="translate-status" class="translate-status" aria-live="polite"></span>
      </div>
    </div>

    <nav class="tab-bar" aria-label="Side panel sections">
      <button id="tab-btn-chat" type="button" class="tab-btn active" data-tab="tab-chat">Chat</button>
      <button id="tab-btn-details" type="button" class="tab-btn" data-tab="tab-details">Details</button>
    </nav>
  </header>

  <div id="first-run-notice" class="banner notice hidden">
    <span>Page text and your questions are sent to the AI provider you choose.</span>
    <button id="btn-ack-notice" type="button" class="btn-link">Dismiss</button>
  </div>

  <div id="no-key-banner" class="banner key-banner hidden">
    <span>Add an API key in Settings</span>
    <button id="btn-open-settings" type="button" class="btn-small">Open Settings</button>
  </div>

  <section id="tab-chat" class="tab-pane active">
    <main class="chat-area">
      <div id="empty-state" class="empty-state">
        <p class="empty-prompt">Ask a question, find text, search, or fill forms.</p>
        <div class="chips-row">
          <button id="chip-what-is-page" type="button" class="chip">What is this page?</button>
          <button id="chip-find" type="button" class="chip">Find something</button>
          <button id="chip-search" type="button" class="chip">Search this site</button>
          <button id="chip-open-url" type="button" class="chip">Open a website</button>
          <button id="chip-fill" type="button" class="chip">Fill this form</button>
        </div>
      </div>

      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
    </main>

    <footer class="composer-wrap">
      <div id="mic-status" class="mic-status hidden" aria-live="polite"></div>
      <label class="auto-allow-row">
        <input id="chk-auto-allow" type="checkbox">
        <span>Auto-allow navigation clicks</span>
      </label>
      <form id="composer-form" class="composer">
        <textarea id="chat-input" class="composer-input" rows="1" placeholder="Ask about this page, find text, search, or fill..." aria-label="Ask a question or give a command"></textarea>
        <button id="btn-mic" type="button" class="icon-btn mic-btn" aria-label="Voice input" title="Voice input">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
        <button id="btn-stop" type="button" class="stop-btn hidden" aria-label="Stop agent" title="Stop (Esc)">Stop</button>
        <button id="btn-send" type="submit" class="send-btn" aria-label="Send message" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </footer>
  </section>

  <section id="tab-details" class="tab-pane hidden">
    <div class="details-tab-wrap">
      <div id="details-status" class="details-status" aria-live="polite"></div>
      <div id="details-container"></div>
    </div>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
